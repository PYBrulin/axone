name: CI Pipeline

on:
  push:
    branches:
      - stable
      - devel
    tags:
      - "v*"
  pull_request:
    branches:
      - stable
      - devel
  workflow_dispatch:

jobs:
  pre-commit:
    uses: ./.github/workflows/pre-commit.yaml
    secrets: inherit

  tests:
    needs: pre-commit
    uses: ./.github/workflows/tests.yaml
    secrets: inherit

  build_wheels:
    needs: tests
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/pywheels.yaml
    secrets: inherit

  release:
    needs: build_wheels
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/release.yaml
    secrets: inherit

  delete_old_workflow_runs:
    needs: release
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/delete_old_workflow_runs.yaml
    secrets: inherit
