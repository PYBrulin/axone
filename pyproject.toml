[project]
name = "axone"
authors = [
    {name = "Pierre-Yves BRULIN", email = "40915900+PYBrulin@users.noreply.github.com"},
]
description = "ROS-like framework for distributed computing implemented in pure-Python"
readme = "README.md"
requires-python = ">=3.7"
keywords = ["AXONE", "distributed-computing", "federated-computational-governance "]
license = {text = "BSD-3-Clause"}
classifiers = [
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["version"]
dependencies = [
    "asyncio",
    "crc",
    "filelock",
    "netifaces",
    'portalocker ; platform_system == "Windows"',
    "zeroconf",
]

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "axone/_version.py"

[tool.setuptools]
packages = ["axone"]

[tool.isort]
known_first_party = "axone"
atomic = true
line_length = 127
multi_line_output = 3
use_parentheses = true
include_trailing_comma = true
force_grid_wrap = 0

[tool.black]
skip-string-normalization = true
line-length = 127
